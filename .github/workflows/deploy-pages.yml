name: Desplegar a GitHub Pages

# Publica la PWA "Bacatá" en GitHub Pages en cada push a main.
# La app se sirve en https://<usuario>.github.io/bacata/, por eso se compila
# con BASE_PATH=/bacata/ (ver vite.config.ts).
#
# Método: compila la app y publica el contenido de dist/ en la rama `gh-pages`.
# Esto funciona con el modo "Deploy from a branch" de GitHub Pages (Settings ->
# Pages -> Source: Deploy from a branch -> Branch: gh-pages / (root)).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# El workflow necesita escribir en la rama gh-pages.
permissions:
  contents: write

# Evita despliegues solapados; deja terminar el que esté en curso.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la PWA (base /bacata/)
        env:
          BASE_PATH: /bacata/
        run: npm run build

      - name: Fallback SPA para rutas profundas (404 -> index)
        run: cp dist/index.html dist/404.html

      # Evita que GitHub Pages procese el sitio con Jekyll (dejaría fuera
      # archivos/carpetas que empiezan por "_").
      - name: Desactivar Jekyll
        run: touch dist/.nojekyll

      - name: Publicar dist/ en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ícono de marca PROVISIONAL de Bacatá.

  Monograma "B" sobre fondo verde esmeralda (#1F7A5A) con trazo crema (#FBF6EC)
  y un detalle dorado (#E2A72E), guiño a la paleta de marca. Formas redondeadas,
  legible a 48 px.

  Es provisional: se reemplazará por el arte final de la mascota (perro andino)
  cuando esté disponible. No bloquea la instalabilidad de la PWA.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Bacatá">
  <rect width="512" height="512" rx="96" fill="#1F7A5A" />
  <circle cx="256" cy="256" r="168" fill="none" stroke="#E2A72E" stroke-width="14" opacity="0.9" />
  <text x="50%" y="50%" dy="0.05em" text-anchor="middle" dominant-baseline="central"
        font-family="'Nunito', 'Baloo 2', 'Segoe UI', sans-serif" font-size="300" font-weight="800"
        fill="#FBF6EC">B</text>
</svg>
